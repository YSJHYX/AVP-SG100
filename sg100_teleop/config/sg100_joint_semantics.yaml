joint_order:
  - thumb_j1
  - thumb_j2
  - thumb_j3
  - index_j1
  - index_j2
  - index_j3
  - middle_j1
  - middle_j2
  - little_j1
  - little_j2
  - little_j3

joints:

  thumb_j1:
    range: [0.0, 2.182]
    semantic: thumb_opposition
    zero: 0.0
    positive_direction: rotate_toward_palm
    # Teleop semantic range: canonical [0, 1] maps onto this subset of
    # the mechanical range, not the full ROM.  The pinch reachability
    # audit requires the full 90 deg (index pinch FK optimum ~79 deg;
    # the 60 deg cap cut pinch reach by 17-91 mm).
    teleop_range: [0.0, 1.5708]
    # Nonlinear response curve: q = zero + (c ** gamma) * (max - zero).
    # gamma 1.5 keeps the 90 deg pinch reach (c=0.9126 -> ~78.5 deg,
    # matching the FK index-pinch optimum) while softening the low/mid
    # canonical gain that over-folded the MCP during normal grasp
    # (c=0.5 -> 31.8 deg instead of the linear 45 deg).
    gamma: 1.5

  thumb_j2:
    range: [-2.61, 0.0]
    semantic: thumb_abduction
    zero: 0.0
    negative_direction: rotate_outward_and_downward
    # Teleop semantic range: FK basis: -60 deg fully extends the thumb
    # outward from the palm plane (d_center 0.144 m, the sweep maximum);
    # the full -149.5 deg over-rotates far beyond natural human thumb
    # abduction and amplified small root motions.
    #teleop_range: [-1.0472, 0.0]
    teleop_range: [-2.0, 0.0]

  thumb_j3:
    range: [-1.048, 1.57]
    semantic: thumb_distal_flexion_extension
    zero: 0.0
    positive_direction: flexion_toward_palm
    negative_direction: extension_outward

  index_j1:
    range: [0.0, 1.57]
    #range: [0.0, 0.0]  # index MCP is mechanically locked on the SG100 (no abduction)
    semantic: index_adduction
    zero: 0.0
    positive_direction: toward_thumb
    #teleop_range: [0.0, 0.0]

  index_j2:
    range: [0.0, 2.18]
    semantic: index_flexion
    zero: 0.0
    positive_direction: flexion_toward_palm

  index_j3:
    range: [-1.05, 1.57]
    semantic: index_distal_flexion_extension
    zero: 0.0
    positive_direction: flexion_toward_palm
    negative_direction: extension_toward_dorsal_side

  middle_j1:
    range: [-2.18, 0.0]
    semantic: middle_flexion
    zero: 0.0
    negative_direction: flexion_toward_palm

  middle_j2:
    range: [-1.05, 1.57]
    semantic: middle_distal_flexion_extension
    zero: 0.0
    positive_direction: flexion_toward_palm
    negative_direction: extension_toward_dorsal_side

  little_j1:
    range: [-3.14, 0.0]
    #range: [0.0, 0.0]
    semantic: little_outward_rotation
    zero: 0.0
    negative_direction: rotate_outward_and_downward
    #teleop_range: [0.0, 0.0]

  little_j2:
    range: [0.0, 2.18]
    semantic: little_flexion
    zero: 0.0
    positive_direction: flexion_toward_palm

  little_j3:
    range: [-1.05, 1.57]
    semantic: little_distal_flexion_extension
    zero: 0.0
    positive_direction: flexion_toward_palm
    negative_direction: extension_toward_dorsal_side

# Pinch-conditioned thumb coordination (generic, config-driven).
#
# Continuous pinch score from existing canonical features only — no
# explicit pinch label:
#     score = thumb_opposition * thumb_abduction * (1 - clamp(thumb_distal, 0, 1))
# gate  = smoothstep(score, lower, upper)
#
# Real AVP operating points:
#   NORMAL_GRASP  opp=.709 abd=.973 dst=.918 -> score .057 -> gate 0
#     (grasp branch preserved EXACTLY: 90*0.709^1.5 = 53.7 deg,
#      -60*0.973 = -58.4 deg)
#   INDEX_PINCH   opp=.540 abd=1.000 dst=.134 -> score .468 -> gate .75
#   MIDDLE_PINCH  opp=.773 abd=1.000 dst=.113 -> score .686 -> gate 1
#   LITTLE_PINCH  opp=.910 abd=1.000 dst=.134 -> score .788 -> gate 1
#
# Blending: q = (1-gate)*q_base + gate*q_pinch.
#   thumb_j1 pinch branch: monotonic interpolation over opposition
#     canonical between the anchors below (interim FK values at q2=0;
#     INDEX/MIDDLE to be re-validated with the live probe diagnostic,
#     LITTLE provisional).
#   thumb_j2 pinch branch: constant pinch target 0 deg (real q2 sweep:
#     q2 -60 -> 0 improves surface distance by 26.9/41.6/38.7 mm for
#     index/middle/little).
# Without this section the retargeter keeps the previous behaviour.
pinch_coordination:
  gate:
    # pinch_signal = clamp(opp,0,1) * clamp(abd,0,1) * (1 - context)
    # global_grasp_context = geometric mean of the clamped non-thumb
    #   finger FLEXION features (index/middle/little_flexion) — NOT
    #   distal features.  Real AVP separation:
    #     NORMAL_GRASP context 0.993 (all fingers closed)  -> signal .005 -> gate 0
    #     INDEX/MIDDLE/LITTLE pinch context 0 (open hand)  -> signal .57/.74/.85 -> gate 1
    #   thumb_distal is no longer a gate input (NOT ROBUST across
    #   pinch targets: grasp .912 vs pinch .526-.664).
    pinch_terms:
      thumb_opposition: direct
      thumb_abduction: direct
    context_features:
      - index_flexion
      - middle_flexion
      - little_flexion
    context_combiner: geometric_mean
    signal_low: 0.20
    signal_high: 0.50
  joints:
    thumb_j1:
      anchors:   # [opposition canonical, q1 deg] — monotonic
        - [0.540, 79.0]
        - [0.773, 104.0]
        - [0.910, 120.0]
        - [1.000, 125.0]
    thumb_j2:
      pinch_target_deg: 0.0

# Grasp-conditioned thumb lock (generic, config-driven).
#
# Problem being solved (FK-measured, see
# sg100_teleop/sim/inspect_sg100_thumb_kinematics.py): at the real AVP
# NORMAL_GRASP operating point (opp=.7595 abd=.8610 dst=.918) the base
# mapping commands thumb_j1 = 90*.7595^1.5 = 59.6 deg.  On the SG100
# morphology that leaves the thumb tip ~59 mm out on the thumb side of
# the index-middle closure region (lateral delta) and ~20 mm in front
# of it (forward delta): no opposition lock — the extended thumb rides
# across the palm opening and can eject the grasped object.  The joint
# itself is correct (thumb_j1 q+ IS opposition toward the palm); the
# human canonical scale simply under-reaches the robot morphology.
#
# FK grid over the same grasp pose (thumb_j3 held at the raw mapping):
#   j1= 59.6 j2=-51.7 -> d_lock 62.3 mm, lateral delta +59 mm
#   j1= 99.6 j2=-51.7 -> d_lock ~30 mm, lateral delta  +4 mm
# thumb_j2 needs NO bias: -51.7 deg already aligns the thumb with the
# closure-region height (normal delta +2 mm); j2=0 would lift it
# ~45 mm above the closure region.  thumb_j3 stays raw as well.
#
# Blend (CONTINUOUS, never a fixed lock pose):
#   grasp_w     = smoothstep(grasp_score, start, full)
#   engage_w    = smoothstep(thumb_opposition, low, high)
#   lock_weight = max_weight * grasp_w * engage_w * (1 - pinch_gate)
#   q_final     = clip(q_raw + lock_weight * bias, mechanical range)
#
# Real AVP operating points:
#   OPEN_HAND   score .000 engage .000 gate 0 -> weight 0 (thumb free)
#   NORMAL_GRASP score .993 engage 1.000 gate 0 -> weight 1 (lock on)
#   INDEX/MIDDLE/LITTLE pinch: gate 1 -> weight 0 (pinch preserved)
#
# Absent section or enabled: false reproduces the previous behaviour
# exactly (locked by test).
power_grasp_thumb_lock:
  enabled: true
  grasp_score:
    # Same closure features/combiner semantics as the pinch gate
    # context; declared here so the lock does not depend on the
    # pinch_coordination section being present.
    features:
      - index_flexion
      - middle_flexion
      - little_flexion
    combiner: geometric_mean
    start: 0.60
    full: 0.85
  thumb_engagement:
    feature: thumb_opposition
    low: 0.35
    high: 0.60
  max_weight: 1.0
  biases_deg:
    thumb_j1: 40.0
    thumb_j2: 0.0
    thumb_j3: 0.0
