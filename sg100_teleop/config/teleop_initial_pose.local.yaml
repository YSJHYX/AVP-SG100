# Fill every null with a measured, collision-checked target before use.
# All angles are canonical/controller DEGREES, not radians.
version: 1
angle_unit: deg

arm:
  angles_deg:
    joint_1: 15
    joint_2: 15
    joint_3: 15
    joint_4: 15
    joint_5: 15
    joint_6: 15
  speed_percent: 5
  timeout_s: 60
  tolerance_deg: 1.0
  max_start_delta_deg: 120.0

hand:
  angles_deg:
    thumb_j1: 0
    thumb_j2: 0
    thumb_j3: 0
    index_j1: 0
    index_j2: 0
    index_j3: 0
    middle_j1: 0
    middle_j2: 0
    little_j1: 0
    little_j2: 0
    little_j3: 0
  command_duration_s: 3.0
