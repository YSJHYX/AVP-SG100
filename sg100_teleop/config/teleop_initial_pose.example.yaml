# Copy this file to teleop_initial_pose.local.yaml and replace every null
# angle with a measured, collision-checked target.  The startup script refuses
# null, missing, non-finite, unknown, or out-of-range joints.  All angles are
# canonical/controller DEGREES; do not enter radians here.
version: 1
angle_unit: deg

arm:
  # Controller address comes from the runner's --arm-ip/--arm-port options.
  # RealMan controller joint order. Exactly six named entries are required.
  angles_deg:
    joint_1: null
    joint_2: null
    joint_3: null
    joint_4: null
    joint_5: null
    joint_6: null
  # Planned rm_movej parameters. Low speed is intentional for startup.
  speed_percent: 5
  timeout_s: 60
  tolerance_deg: 1.0
  # Abort before motion if any target-current difference is larger than this.
  max_start_delta_deg: 120.0

hand:
  # Port/SDK settings come from --hand-port/--hand-baudrate/--hand-sdk-dir.
  # Canonical SG100 order. Exactly eleven named entries are required.
  angles_deg:
    thumb_j1: null
    thumb_j2: null
    thumb_j3: null
    index_j1: null
    index_j2: null
    index_j3: null
    middle_j1: null
    middle_j2: null
    little_j1: null
    little_j2: null
    little_j3: null
  # The low-gain target stays active for this long before passive cleanup.
  command_duration_s: 3.0
